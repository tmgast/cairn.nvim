name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: server/go.sum
      - name: build
        working-directory: server
        run: go build -o cairn-server .
      - name: vet
        working-directory: server
        run: go vet ./...
